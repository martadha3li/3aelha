<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استعادة الحساب | منصة العائلة</title>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 380px; padding: 30px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .logo-img { width: 70px; margin-bottom: 15px; border-radius: 18px; }
        .form-input { width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 14px; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 15px; text-align: center; background: #f9f9fb; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary); background: white; }
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { background: #ccc; cursor: not-allowed; }
        .link-text { color: var(--primary); cursor: pointer; font-weight: bold; font-size: 13px; text-decoration: none; display: block; margin-top: 15px; }
        .success-box { display: none; color: #34c759; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img src="logo.png" class="logo-img">
        <h3>نسيت كلمة المرور؟</h3>
        <p style="color: #666; font-size: 13px; margin-bottom: 20px;">أدخل بياناتك وسيقوم مدير المنصة بالتواصل معك لتغيير كلمة المرور.</p>
        
        <div id="formContainer">
            <input type="email" id="forgotEmail" class="form-input" placeholder="البريد الإلكتروني المسجل">
            <input type="tel" id="forgotPhone" class="form-input" placeholder="رقم الجوال المرتبط بالحساب">
            
            <button id="sendRequestBtn" class="btn-main" onclick="sendResetRequestToAdmin()">إرسال طلب للمدير</button>
        </div>

        <div id="successMessage" class="success-box">
            <div style="font-size: 40px; margin-bottom: 10px;">✅</div>
            <p>تم إرسال طلبك بنجاح!</p>
            <p style="font-size: 12px; color: #666;">سيتم مراجعة بياناتك وتحديث كلمة مرورك قريباً.</p>
        </div>

        <a href="login.html" class="link-text">العودة لصفحة الدخول</a>
    </div>

    <script type="module">
        import { db } from './config.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.sendResetRequestToAdmin = async () => {
            const email = document.getElementById('forgotEmail').value.trim();
            const phone = document.getElementById('forgotPhone').value.trim();
            const btn = document.getElementById('sendRequestBtn');

            if (!email || !phone) {
                return alert("يرجى إدخال البريد والجوال معاً");
            }

            // تحقق بسيط من صحة الإيميل
            if (!email.includes("@")) {
                return alert("يرجى إدخال بريد إلكتروني صحيح");
            }

            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            try {
                // حفظ الطلب في Firestore
                await addDoc(collection(db, "ResetRequests"), {
                    userEmail: email,
                    userPhone: phone,
                    status: "pending", // حالة الطلب (قيد الانتظار)
                    timestamp: serverTimestamp()
                });

                // إخفاء النموذج وإظهار رسالة النجاح
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

            } catch (error) {
                console.error("Error sending request:", error);
                alert("حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً.");
                btn.disabled = false;
                btn.innerText = "إرسال طلب للمدير";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة العائلة | التايم لاين</title>
    <style>
        :root {
            --ios-blue: #007AFF; --ios-red: #FF3B30; --ios-bg: #F2F2F7;
            --card-bg: #FFFFFF; --text-main: #1c1c1e; --text-sec: #8E8E93;
            --shadow: 0 8px 20px rgba(0,0,0,0.08);
            --gold: #D4AF37; --death-gray: #4a4a4a;
        }

        body { 
            background-color: var(--ios-bg); font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding-top: 10px; padding-bottom: 100px; direction: rtl;
        }

        /* كود تعريف المستخدم العلوي - قابل للضغط */
        .user-header-profile {
            background: white;
            margin: 15px;
            padding: 18px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #E5E5EA;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .user-header-profile:active { transform: scale(0.98); background: #f9f9f9; }

        .user-avatar-circle {
            width: 55px; height: 55px; background: var(--ios-blue);
            color: white; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 22px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
        }
        .user-info-text b { display: block; font-size: 16px; color: var(--text-main); }
        .user-info-text span { font-size: 13px; color: var(--text-sec); display: block; }
        .user-info-text small { color: var(--ios-blue); font-size: 11px; font-weight: bold; }

        /* تنسيقات البطاقات والأخبار */
        #pinnedArea { padding: 0 15px; margin-bottom: 10px; }
        .pin-card-wedding { background: linear-gradient(45deg, #fff9e6, #fff); border: 1px solid var(--gold); border-radius: 15px; padding: 10px 15px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .pin-card-death { background: #f0f0f0; border-right: 5px solid var(--death-gray); border-radius: 10px; padding: 10px 15px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }

        .post-card { background: var(--card-bg); margin: 12px 15px; border-radius: 20px; display: flex; padding: 12px; gap: 15px; box-shadow: var(--shadow); position: relative; border: .5px solid #E5E5EA; cursor: pointer; }
        .post-image-container { width: 85px; height: 85px; flex-shrink: 0; }
        .post-image { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; background: #eee; }
        .post-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .post-title { margin: 0; font-size: 15px; font-weight: 800; color: var(--text-main); line-height: 1.4; }
        .post-meta { display: flex; gap: 8px; margin-top: 5px; font-size: 11px; color: var(--text-sec); }
        .meta-item { background: #f5f5f7; padding: 3px 8px; border-radius: 6px; }

        /* المودال */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 6000; align-items: flex-end; justify-content: center; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 25px 25px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* خيارات المدير */
        .options-btn { position: absolute; left: 0; top: 0; color: #ccc; font-size: 20px; padding: 5px; z-index: 10; }
        .dropdown { position: absolute; left: 0; top: 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; flex-direction: column; z-index: 100; border: 1px solid #eee; overflow: hidden; }
        .dropdown button { padding: 10px 15px; border: none; background: none; text-align: right; font-size: 13px; cursor: pointer; }

        /* نافذة طلب الاسم */
        #nameOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .name-card { background: white; width: 85%; max-width: 350px; padding: 30px; border-radius: 25px; text-align: center; }
    </style>
</head>
<body>

    <div id="userTopProfile" class="user-header-profile" style="display:none;" onclick="window.location.href='profile.html'">
        <div class="user-avatar-circle" id="userAvatar">؟</div>
        <div class="user-info-text">
            <b id="displayFullName">جاري التحميل...</b>
            <span id="displayAge">جاري حساب العمر...</span>
            <small>الملف الشخصي ←</small>
        </div>
    </div>

    <script type="module" src="header.js"></script>
    <script type="module" src="navbar.js"></script>

    <div id="pinnedArea"></div>
    <div id="newsFeed"></div>

    <div id="postModal" class="modal" onclick="if(event.target==this)this.style.display='none'">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <div id="nameOverlay">
        <div class="name-card">
            <h2>أهلاً بك في العائلة 👋</h2>
            <p>يرجى كتابة اسمك الرباعي ليتمكن الجميع من معرفتك</p>
            <input type="text" id="newUserNameInput" placeholder="الاسم الأول، الأب، الجد، العائلة" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; text-align:center;">
            <button id="saveNameBtn" style="width:100%; padding:15px; background:var(--ios-blue); color:white; border:none; border-radius:12px; font-weight:bold;">حفظ ومتابعة</button>
        </div>
    </div>

<script type="module">
    import { auth, db } from './config.js';
    import { collection, onSnapshot, doc, getDoc, setDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { monitorSession } from './check_access.js';

    let userUID, userName = "عضو", isAdmin = false;

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userUID = user.uid;
            monitorSession(userUID); 

            try {
                const userSnap = await getDoc(doc(db, "Users", userUID));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    if (data.fullName) {
                        userName = data.fullName;
                        isAdmin = (data.role || "").toLowerCase().includes('admin') || (data.role || "").includes('مدير');
                        updateHeaderUI(data);
                        loadPosts();
                    } else {
                        showNameRequest();
                    }
                } else {
                    showNameRequest();
                }
            } catch (err) {
                console.error(err);
            }
        } else { 
            window.location.href = "index.html"; 
        }
    });

    function updateHeaderUI(data) {
        document.getElementById('userTopProfile').style.display = 'flex';
        document.getElementById('displayFullName').innerText = data.fullName;
        document.getElementById('userAvatar').innerText = data.fullName.charAt(0);
        
        if (data.birthDate) {
            const birth = new Date(data.birthDate);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            document.getElementById('displayAge').innerText = "العمر: " + age + " سنة";
        } else {
            document.getElementById('displayAge').innerText = "أضف تاريخ ميلادك من البروفايل";
        }
    }

    function showNameRequest() { document.getElementById('nameOverlay').style.display = 'flex'; }

    document.getElementById('saveNameBtn').onclick = async () => {
        const val = document.getElementById('newUserNameInput').value.trim();
        if (val.split(' ').length < 3) return alert("يرجى كتابة الاسم الثلاثي أو الرباعي");
        await setDoc(doc(db, "Users", userUID), { fullName: val, role: "member", createdAt: serverTimestamp() }, { merge: true });
        location.reload();
    };

    function loadPosts() {
        onSnapshot(query(collection(db, "News"), orderBy("publishDate", "desc")), (snap) => {
            const feed = document.getElementById('newsFeed');
            const pinned = document.getElementById('pinnedArea');
            feed.innerHTML = ""; pinned.innerHTML = "";
            
            snap.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                
                if (post.type === 'wedding' || post.type === 'death') {
                    const p = document.createElement('div');
                    p.className = post.type === 'wedding' ? 'pin-card-wedding' : 'pin-card-death';
                    p.onclick = () => window.showPostFull(postId);
                    p.innerHTML = `<span>${post.type === 'wedding' ? '💍' : '🖤'}</span> <b style="flex:1;">${post.title}</b>`;
                    pinned.appendChild(p);
                }

                const card = document.createElement('div');
                card.className = "post-card";
                card.onclick = () => window.showPostFull(postId);
                card.innerHTML = `
                    <div class="post-image-container"><img class="post-image" src="${post.img || 'logo.png'}"></div>
                    <div class="post-info">
                        ${isAdmin ? `<div class="options-btn" onclick="event.stopPropagation(); window.toggleDrop('${postId}')">⋮</div>
                        <div id="drop-${postId}" class="dropdown"><button onclick="event.stopPropagation(); window.delNews('${postId}')" style="color:red;">🗑️ حذف</button></div>` : ''}
                        <h2 class="post-title">${post.title}</h2>
                        <div class="post-meta">
                            <span class="meta-item">❤️ ${post.likedBy?.length || 0}</span>
                            <span class="meta-item">💬 ${post.comments?.length || 0}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        });
    }

    window.showPostFull = async (id) => {
        const snap = await getDoc(doc(db, "News", id));
        const post = snap.data();
        const hasLiked = post.likedBy?.includes(userUID);
        updateDoc(doc(db, "News", id), { viewedBy: arrayUnion(userUID) });

        document.getElementById('modalBody').innerHTML = `
            <div style="padding:10px;">
                ${post.img ? `<img src="${post.img}" style="width:100%; border-radius:15px; margin-bottom:15px;">` : ''}
                <h3>${post.title}</h3>
                <p style="color:#444; line-height:1.6;">${post.content || post.body || ''}</p>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <div style="display:flex; gap:20px; font-size:14px;">
                    <span onclick="window.like('${id}', ${hasLiked})" style="cursor:pointer; color:${hasLiked ? 'red' : 'gray'}">❤️ أعجبني</span>
                    <span style="color:gray;">👁️ ${post.viewedBy?.length || 0} مشاهدة</span>
                </div>
            </div>
        `;
        document.getElementById('postModal').style.display = 'flex';
    };

    window.like = async (id, liked) => {
        await updateDoc(doc(db, "News", id), { likedBy: liked ? arrayRemove(userUID) : arrayUnion(userUID) });
        window.showPostFull(id);
    };

    window.toggleDrop = (id) => {
        document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        document.getElementById(`drop-${id}`).style.display = 'flex';
    };

    window.delNews = async (id) => { if(confirm("حذف الخبر؟")) await deleteDoc(doc(db, "News", id)); };
    document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none'));
</script>
</body>
</html>

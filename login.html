<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة العائلة | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --primary-light: #e5f1ff;
            --bg: #f2f2f7;
            --card: #ffffff;
            --text-main: #1c1c1e;
            --text-sec: #8e8e93;
            --error: #ff3b30;
            --success: #34c759;
        }

        body {
            font-family: 'Cairo', -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card);
            padding: 40px 30px;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-area img {
            width: 85px;
            height: 85px;
            border-radius: 22px;
            margin-bottom: 15px;
            box-shadow: 0 8px 15px rgba(0,122,255,0.15);
        }

        h2 { font-size: 24px; margin: 0 0 10px 0; font-weight: 700; }
        p.subtitle { color: var(--text-sec); font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-right: 10px; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: var(--text-sec); }
        
        .form-input {
            width: 100%;
            padding: 16px;
            border: 1.5px solid #f2f2f7;
            border-radius: 18px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            background: #f9f9fb;
            transition: all 0.3s ease;
            text-align: center;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-primary:active { transform: scale(0.98); }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            border: 1.5px solid #eee;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-google:hover { background: #fafafa; }

        .divider {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: #ccc;
            font-size: 12px;
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eee; }
        .divider span { padding: 0 10px; }

        .footer-links { margin-top: 25px; font-size: 13px; }
        .link { color: var(--primary); text-decoration: none; font-weight: bold; cursor: pointer; }
        
        .error-msg { color: var(--error); font-size: 12px; margin-top: 10px; display: none; }

        /* الأنماط المخفية */
        .hidden { display: none; }

        /* أنيميشن بسيط */
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card fade-in">
            <div class="logo-area">
                <img src="logo.png" alt="Logo">
            </div>

            <div id="classicSection">
                <h2>أهلاً بك</h2>
                <p class="subtitle">سجل دخولك لمتابعة أخبار العائلة</p>

                <div class="input-group">
                    <input type="text" id="email" class="form-input" placeholder="البريد الإلكتروني أو الجوال">
                </div>
                <div class="input-group" style="margin-bottom: 5px;">
                    <input type="password" id="password" class="form-input" placeholder="كلمة المرور">
                </div>
                
                <div style="text-align: left; margin-bottom: 20px;">
                    <a href="forgot.html" class="link" style="font-size: 12px;">نسيت كلمة المرور؟</a>
                </div>

                <button class="btn-primary" onclick="handleLogin()">دخول</button>

                <div class="divider"><span>أو عبر</span></div>

                <button class="btn-google" onclick="handleGoogleSignIn()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18">
                    متابعة باستخدام Google
                </button>

                <div class="footer-links">
                    <span>ليس لديك حساب؟</span> <a href="register.html" class="link">انضم إلينا</a>
                    <br><br>
                    <span class="link" onclick="toggleView('magic')">دخول سريع عبر رابط الإيميل</span>
                </div>
            </div>

            <div id="magicSection" class="hidden">
                <h2>دخول سريع</h2>
                <p class="subtitle">سنرسل رابطاً لبريدك لتدخل فوراً دون كلمة مرور</p>
                
                <div class="input-group">
                    <input type="email" id="magicEmail" class="form-input" placeholder="name@example.com">
                </div>

                <button class="btn-primary" onclick="handleMagicLink()">إرسال رابط التفعيل</button>
                
                <div class="footer-links">
                    <span class="link" onclick="toggleView('classic')">العودة للطريقة التقليدية</span>
                </div>
            </div>

            <div id="errorMessage" class="error-msg"></div>
        </div>
    </div>

    <script type="module">
        import { auth } from './config.js';
        import { 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            sendSignInLinkToEmail 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const errorDiv = document.getElementById('errorMessage');

        function showError(text) {
            errorDiv.innerText = text;
            errorDiv.style.display = 'block';
        }

        // 1. الدخول التقليدي
        window.handleLogin = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if(!email || !password) return showError("يرجى ملء جميع الحقول");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "news.html";
            } catch (error) {
                showError("تأكد من صحة البيانات المدخلة");
            }
        };

        // 2. الدخول عبر جوجل
        window.handleGoogleSignIn = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "news.html";
            } catch (error) {
                showError("فشل الاتصال بحساب جوجل");
            }
        };

        // 3. الرابط السحري
        window.handleMagicLink = async () => {
            const email = document.getElementById('magicEmail').value.trim();
            if(!email) return showError("يرجى إدخال البريد الإلكتروني");

            const actionCodeSettings = {
                url: window.location.origin + '/news.html',
                handleCodeInApp: true,
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                window.localStorage.setItem('emailForSignIn', email);
                alert("تم إرسال الرابط بنجاح، تفقد بريدك الوارد");
            } catch (error) {
                showError("حدث خطأ: " + error.code);
            }
        };

        // التنقل بين الواجهات
        window.toggleView = (view) => {
            errorDiv.style.display = 'none';
            if(view === 'magic') {
                document.getElementById('classicSection').classList.add('hidden');
                document.getElementById('magicSection').classList.remove('hidden');
            } else {
                document.getElementById('magicSection').classList.add('hidden');
                document.getElementById('classicSection').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>

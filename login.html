<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول | منصة العائلة</title>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 380px; padding: 40px 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .hidden { display: none; }
        .logo-img { width: 80px; margin-bottom: 20px; border-radius: 20px; }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p { color: #8e8e93; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .form-input { width: 100%; padding: 15px; border: 1.5px solid #eee; border-radius: 15px; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 20px; text-align: center; background: #f9f9fb; }
        .form-input:focus { border-color: var(--primary); background: white; }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main:disabled { background: #ccc; }
        .status-icon { font-size: 50px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="requestStep" class="card">
        <img src="logo.png" class="logo-img">
        <h2>تسجيل دخول سريع</h2>
        <p>أدخل بريدك الإلكتروني وسنرسل لك رابطاً يمكنك من خلاله الدخول فوراً بدون كلمة مرور.</p>
        
        <input type="email" id="email" class="form-input" placeholder="name@example.com">
        <button id="sendBtn" class="btn-main" onclick="sendLoginLink()">إرسال رابط الدخول</button>
    </div>

    <div id="waitStep" class="card hidden">
        <div class="status-icon">📧</div>
        <h2>تفقد بريدك الآن</h2>
        <p id="msgText">لقد أرسلنا رابط الدخول إلى بريدك. يرجى الضغط على الرابط في الرسالة للمتابعة.</p>
        <button class="btn-main" style="background: #e5e5ea; color: #000;" onclick="location.reload()">العودة للخلف</button>
    </div>

    <div id="loadingStep" class="card hidden">
        <div class="status-icon">🔄</div>
        <h2>جاري التحقق...</h2>
        <p>يرجى الانتظار لحظة بينما نقوم بتسجيل دخولك.</p>
    </div>

    <script type="module">
        import { auth } from './config.js';
        import { sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const requestStep = document.getElementById('requestStep');
        const waitStep = document.getElementById('waitStep');
        const loadingStep = document.getElementById('loadingStep');

        // 1. وظيفة إرسال الرابط
        window.sendLoginLink = async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) return alert("يرجى إدخال البريد الإلكتروني");

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerText = "جاري الإرسال...";

            const actionCodeSettings = {
                // الرابط الذي سيعود إليه المستخدم (يجب أن يكون رابط صفحة Login نفسها)
                url: window.location.href, 
                handleCodeInApp: true,
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                // حفظ البريد في الذاكرة المحلية لأننا سنحتاجه عند العودة
                window.localStorage.setItem('emailForSignIn', email);
                
                requestStep.classList.add('hidden');
                waitStep.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء الإرسال: " + error.message);
                sendBtn.disabled = false;
                sendBtn.innerText = "إرسال رابط الدخول";
            }
        };

        // 2. وظيفة التحقق عند فتح الصفحة (هل المستخدم قادم من رابط الإيميل؟)
        window.onload = async () => {
            if (isSignInWithEmailLink(auth, window.location.href)) {
                requestStep.classList.add('hidden');
                loadingStep.classList.remove('hidden');

                let email = window.localStorage.getItem('emailForSignIn');
                
                // إذا فتح المستخدم الرابط من جهاز مختلف، نطلب منه تأكيد البريد
                if (!email) {
                    email = window.prompt('يرجى إدخال بريدك الإلكتروني للتأكيد:');
                }

                try {
                    await signInWithEmailLink(auth, email, window.location.href);
                    window.localStorage.removeItem('emailForSignIn'); // تنظيف الذاكرة
                    window.location.replace("news.html"); // التوجه للصفحة الرئيسية
                } catch (error) {
                    console.error(error);
                    alert("الرابط غير صالح أو انتهت صلاحيته.");
                    window.location.reload();
                }
            }
        };
    </script>
</body>
</html>

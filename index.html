<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة العائلة | جاري التحميل</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --ios-blue: #007aff; --bg: #ffffff; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg); overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .splash-container { text-align: center; animation: fadeIn 1.2s ease-in-out; }
        .logo-splash { 
            width: 120px; height: 120px; margin-bottom: 25px; 
            border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            object-fit: cover;
        }
        .loader {
            width: 30px; height: 30px; border: 3px solid #f3f3f3;
            border-top: 3px solid var(--ios-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 20px auto;
        }
        .welcome-text { color: #1c1c1e; font-weight: 600; font-size: 20px; letter-spacing: -0.5px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ستايل بانر التثبيت */
        #installBanner {
            display:none; position: fixed; bottom: 30px; left: 20px; right: 20px; 
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 22px; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.15); z-index: 9999; 
            align-items: center; gap: 15px; border: 1px solid rgba(0,122,255,0.2);
            backdrop-filter: blur(10px); animation: slideUp 0.5s ease;
        }
        @keyframes slideUp { from { transform: translateY(100px); } to { transform: translateY(0); } }
        .btn-install { background: var(--ios-blue); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <div class="splash-container">
        <img src="logo.png" alt="شعار العائلة" class="logo-splash" onerror="this.src='https://via.placeholder.com/120?text=Family'">
        <div class="welcome-text">منصة العائلة</div>
        <div class="loader"></div>
    </div>

    <div id="installBanner">
        <img src="logo.png" alt="Logo" style="width: 45px; height: 45px; border-radius: 12px;">
        <div style="flex: 1;">
            <b style="display: block; font-size: 14px;">ثبت التطبيق على هاتفك</b>
            <span style="font-size: 11px; color: #666;">للوصول السريع وتلقي الأخبار</span>
        </div>
        <button id="btnInstall" class="btn-install">تثبيت</button>
        <button onclick="document.getElementById('installBanner').style.display='none'" style="background: none; border: none; font-size: 20px; color: #ccc; cursor: pointer;">✕</button>
    </div>

    <script type="module">
        import { auth } from './config.js';

        // 1. التوجيه الذكي
        // تم استخدام window.location.href لضمان التوافق مع GitHub Pages
        setTimeout(() => {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // نستخدم ./news.html لضمان أن المسار نسبي لنفس المجلد
                    window.location.href = "./news.html";
                } else {
                    window.location.href = "./login.html";
                }
            });
        }, 2500); 

        // 2. معالجة PWA (التثبيت كـ App)
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');
        const btnInstall = document.getElementById('btnInstall');

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW Registered');
                }).catch(err => console.log('SW Error', err));
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // إظهار البانر إذا لم يسبق التثبيت
            if (!localStorage.getItem('app_installed')) {
                installBanner.style.display = 'flex';
            }
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    localStorage.setItem('app_installed', 'true');
                    installBanner.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>

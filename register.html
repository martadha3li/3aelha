<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انضمام للعائلة | تسجيل حساب جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; --text: #1c1c1e; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px 0; display: flex; justify-content: center; }
        
        .reg-card { background: white; width: 95%; max-width: 500px; padding: 30px; border-radius: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 25px; color: var(--primary); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #666; margin-right: 5px; }
        .input-style { width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 15px; font-size: 15px; box-sizing: border-box; outline: none; background: #f9f9fb; font-family: 'Cairo'; }
        .input-style:focus { border-color: var(--primary); background: #fff; }
        
        .btn-reg { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 18px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-reg:disabled { background: #ccc; }

        #locationStatus { font-size: 11px; color: var(--primary); margin-top: 5px; text-align: center; }
        .hidden { display: none; }
        .link { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="reg-card">
        <h2>حساب جديد</h2>
        
        <div class="form-grid">
            <div>
                <label>الاسم الأول *</label>
                <input type="text" id="fName" class="input-style" placeholder="مثال: أحمد">
            </div>
            <div>
                <label>اسم الأب *</label>
                <input type="text" id="pName" class="input-style">
            </div>
            <div>
                <label>اسم الجد *</label>
                <input type="text" id="gName" class="input-style">
            </div>
            <div>
                <label>الجد الثاني (اختياري)</label>
                <input type="text" id="g2Name" class="input-style">
            </div>
            <div class="full-width">
                <label>لقب العائلة *</label>
                <input type="text" id="lName" class="input-style" placeholder="العائلة">
            </div>

            <div class="full-width">
                <label>البريد الإلكتروني *</label>
                <input type="email" id="email" class="input-style" placeholder="name@example.com">
            </div>
            <div class="full-width">
                <label>رقم الجوال *</label>
                <input type="tel" id="phone" class="input-style" placeholder="05xxxxxxxx">
            </div>
            <div>
                <label>تاريخ الميلاد *</label>
                <input type="date" id="dob" class="input-style">
            </div>
            <div>
                <label>الجنس *</label>
                <select id="gender" class="input-style" onchange="checkGender()">
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>

            <div id="identityBox" class="full-width hidden">
                <label>المعرف (خاص للإناث) *</label>
                <input type="text" id="identity" class="input-style" placeholder="رقم المعرف أو الهوية">
            </div>

            <div class="full-width">
                <label>المدينة *</label>
                <select id="city" class="input-style">
                    <option value="">اختر المدينة...</option>
                    <option value="الرياض">الرياض</option>
                    <option value="جدة">جدة</option>
                    <option value="مكة المكرمة">مكة المكرمة</option>
                    <option value="المدينة المنورة">المدينة المنورة</option>
                    <option value="الدمام">الدمام</option>
                    <option value="الطائف">الطائف</option>
                    <option value="تبوك">تبوك</option>
                    <option value="بريدة">بريدة</option>
                    <option value="خميس مشيط">خميس مشيط</option>
                    <option value="الهفوف">الهفوف</option>
                    <option value="المبرز">المبرز</option>
                    <option value="حفر الباطن">حفر الباطن</option>
                    <option value="حائل">حائل</option>
                    <option value="نجران">نجران</option>
                    <option value="الجبيل">الجبيل</option>
                    <option value="أبها">أبها</option>
                    <option value="ينبع">ينبع</option>
                    <option value="الخبر">الخبر</option>
                    <option value="عرعر">عرعر</option>
                    <option value="جيزان">جيزان</option>
                    <option value="سكاكا">سكاكا</option>
                    <option value="الباحة">الباحة</option>
                </select>
            </div>

            <div class="full-width">
                <label>كلمة المرور *</label>
                <input type="password" id="password" class="input-style" placeholder="********">
            </div>
        </div>

        <div id="locationStatus">جاري تحديد موقعك الجغرافي... 📍</div>
        
        <button id="regBtn" class="btn-reg" onclick="handleRegister()">إنشاء الحساب</button>

        <p style="text-align: center; margin-top: 20px;">
            لديك حساب بالفعل؟ <a href="login.html" class="link">سجل دخولك</a>
        </p>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let userCoords = { lat: null, lng: null };

        // 1. جلب الموقع الجغرافي فور فتح الصفحة
        window.onload = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userCoords.lat = position.coords.latitude;
                        userCoords.lng = position.coords.longitude;
                        document.getElementById('locationStatus').innerText = "تم تحديد الموقع بنجاح ✅";
                    },
                    () => {
                        document.getElementById('locationStatus').innerText = "تعذر جلب الموقع، سيتم التسجيل بدونه.";
                    }
                );
            }
        };

        // 2. إظهار/إخفاء حقل المعرف
        window.checkGender = () => {
            const gender = document.getElementById('gender').value;
            const box = document.getElementById('identityBox');
            if(gender === 'أنثى') box.classList.remove('hidden');
            else box.classList.add('hidden');
        };

        // 3. عملية التسجيل
        window.handleRegister = async () => {
            const fName = document.getElementById('fName').value.trim();
            const pName = document.getElementById('pName').value.trim();
            const gName = document.getElementById('gName').value.trim();
            const g2Name = document.getElementById('g2Name').value.trim();
            const lName = document.getElementById('lName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dob = document.getElementById('dob').value;
            const gender = document.getElementById('gender').value;
            const identity = document.getElementById('identity').value;
            const city = document.getElementById('city').value;
            const password = document.getElementById('password').value;

            // التحقق من الحقول الإلزامية
            if(!fName || !pName || !gName || !lName || !email || !phone || !dob || !city || !password) {
                return alert("يرجى ملء جميع الحقول المطلوبة (*)");
            }

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerText = "جاري إنشاء الحساب...";

            try {
                // إنشاء الحساب في Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // تخزين البيانات في Firestore
                await setDoc(doc(db, "Users", user.uid), {
                    fullName: `${fName} ${pName} ${gName} ${g2Name} ${lName}`.replace(/\s+/g, ' '),
                    details: { fName, pName, gName, g2Name, lName },
                    email: email,
                    phone: phone,
                    birthDate: dob,
                    gender: gender,
                    identity: gender === 'أنثى' ? identity : null,
                    city: city,
                    location: userCoords,
                    role: "member",
                    createdAt: serverTimestamp()
                });

                alert("تم التسجيل بنجاح! مريباً بك في العائلة.");
                window.location.href = "news.html";

            } catch (error) {
                console.error(error);
                alert("خطأ في التسجيل: " + error.message);
                btn.disabled = false;
                btn.innerText = "إنشاء الحساب";
            }
        };
    </script>
</body>
</html>
